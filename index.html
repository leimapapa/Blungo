<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2f5a">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 212 212'%3E%3Ccircle cx='106' cy='106' r='100' fill='%23cba9e5' stroke='%237030a0' stroke-width='10'%3E%3C/circle%3E%3Ccircle cx='57' cy='50' r='10' fill='none' stroke='%23ffb900' stroke-width='2'%3E%3C/circle%3E%3Ccircle cx='62' cy='68' r='6' fill='none' stroke='%23ffb900' stroke-width='2'%3E%3C/circle%3E%3Ccircle cx='62' cy='80' r='3' fill='none' stroke='%23ffb900' stroke-width='2'%3E%3C/circle%3E%3Cg fill='%23fff' stroke='%237030a0' stroke-width='5'%3E%3Cellipse cx='152' cy='79' rx='25' ry='24'%3E%3C/ellipse%3E%3Cellipse cx='115' cy='85' rx='23' ry='24'%3E%3C/ellipse%3E%3Ccircle cx='112' cy='84' r='10' fill='none' stroke='%23385723'%3E%3C/circle%3E%3Ccircle cx='159' cy='81' r='10' fill='%23385723' stroke='none'%3E%3C/circle%3E%3C/g%3E%3Cpath d='M 130 66 c 3 -18 39 -29 45 1 q -23 -3 -39 8 zM 93 90 c -8 -33 33 -41 43 -15 q -25 -1 -43 15 z' fill='%23cba9e5' stroke='%237030a0' stroke-width='5'%3E%3C/path%3E%3Cpath d='M 101 120 c 23 77 91 59 71 -22 c -8 13 -33 31 -71 22 z' fill='%237030a0'%3E%3C/path%3E%3Cpath d='M 101 120 c 13 53 86 51 71 -22 c -8 13 -33 31 -71 22 z' fill='%23000'%3E%3C/path%3E%3Cpath d='M 129 122 l 2 11 q 1 2 3 2 l 6 -1 q 2 -1 2 -3 l -2 -10.5 c -2 0.5 -6 1.5 -11 1.5 z' fill='%23fff'%3E%3C/path%3E%3C/svg%3E">
  <title>Drinkin' Round The World</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Verdana,sans-serif;background:#fff;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:#fff;border:0;cursor:pointer;padding:0}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#drinkCount{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:1.1em;color:#fff;z-index:1;pointer-events:none;padding:9px 16px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(12,24,47,.55);backdrop-filter:blur(8px);text-shadow:0 2px 4px #14243f}
h2{text-align:center;margin:10px;color:#fff}
.subtext{color:#fff;font-size:.6em;text-shadow:1px 1px #000}

/* round buttons */
.round{border-radius:50%;width:60px;height:60px;font-size:2.2em;line-height:1;display:grid;place-items:center;transition:transform .1s}
.round:active{transform:translateY(3px)}
.round.big{width:100px;height:100px;font-size:3em}
.green{background:#1e7541;box-shadow:0 5px #0a612d}
.teal{background:#7bcfcf;box-shadow:0 5px #499d9d}
.blue{background:#2b66a5;box-shadow:0 5px #1c2f5a}
.orange{background:#eb9f23;box-shadow:0 5px #cd8105}
.sky{background:#4fc3f7;box-shadow:0 5px #3bafe3}
.navy{background:#1c2f5a;box-shadow:0 5px #081b46}
#pauseBtn{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:10;font-size:1.6em;padding-bottom:4px}
.icon-svg{display:block;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.pause-icon{width:30px;height:30px;stroke-width:4.5}
.home-icon{width:42px;height:42px;stroke-width:2}

/* panels */
.panel{position:fixed;right:0;bottom:0;border-radius:25px 0 0 0;overflow:hidden}
.close{position:absolute;top:0;right:0;width:50px;height:60px;font-size:2.4em;background:none;color:#f5f5f5;z-index:100}
.panel .round{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.panel .round:active{transform:translate(-50%,calc(-50% + 3px))}
#optSound,#pSound{left:calc(50% - 105px)}
#optFull,#pFull{left:calc(50% + 105px)}
#pSound,#pFull{left:auto}
.teal-panel{width:100%;max-width:400px;height:50%;background:rgba(123,207,207,.8);z-index:350;animation:slide .3s}
.options-actions{position:absolute;inset:72px 24px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(12px,4vw,24px);place-items:center}
.teal-panel .options-actions .round{position:relative;top:auto;left:auto;transform:none;width:clamp(72px,20vw,100px);height:clamp(72px,20vw,100px);font-size:clamp(2.2em,7vw,3em)}
.teal-panel .options-actions .round:active{transform:translateY(3px)}
.teal-panel #optSound,.teal-panel #optFull{left:auto}
.options-actions #optCreator{grid-column:1 / -1}
.green-panel{width:min(95%,440px);height:min(95%,520px);background:rgba(18,55,57,.94);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(16px);z-index:200;animation:slide .3s}
.pause-actions{position:absolute;inset:76px 28px 30px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(18px,5vw,34px);place-items:center}
.green-panel .pause-actions .round{position:relative;top:auto;left:auto;transform:none;width:clamp(72px,20vw,100px);height:clamp(72px,20vw,100px);font-size:clamp(2.2em,7vw,3em)}
.green-panel .pause-actions .round:active{transform:translateY(3px)}
.home{top:auto!important;bottom:10px;left:50%!important;transform:translateX(-50%)!important}
@keyframes slide{from{transform:translate(30%,30%);opacity:0}}

/* main menu */
#mainMenu{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0,#385d83 0,#192943 48%,#101a2d 100%);overflow-y:auto;overscroll-behavior:contain;z-index:300;color:#fff;padding:clamp(20px,5vh,54px) clamp(16px,5vw,64px) max(24px,env(safe-area-inset-bottom))}
.menu-shell{width:min(100%,1080px);min-height:100%;margin:auto;display:flex;flex-direction:column;align-items:center}
.title{margin:0;color:#fff;font-size:clamp(1.4rem,4vw,2.35rem);letter-spacing:.04em;text-align:center;text-shadow:0 3px 18px rgba(0,0,0,.4)}
.menu-subtitle{margin:8px 0 18px;color:#cad9e9;text-align:center;font-size:clamp(.85rem,2vw,1rem)}
.coin-total{align-self:center;display:flex;align-items:center;gap:7px;margin:0 0 22px;padding:9px 16px;border:1px solid rgba(255,213,93,.45);border-radius:999px;background:rgba(8,18,34,.48);color:#ffe29a;font-weight:700}
.coin-icon{display:inline-grid;place-items:center;width:1.1em;height:1.1em;border-radius:50%;border:2px solid #b77e18;background:linear-gradient(145deg,#fff1aa,#e0a62e);color:#80520a;font-size:.82em;font-weight:900;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.level-grid{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,24px);margin:auto 0}
.level{position:relative;min-height:270px;border:1px solid rgba(255,255,255,.2);border-radius:22px;overflow:hidden;transition:transform .18s,border-color .18s,filter .18s;background:linear-gradient(145deg,#264966,#192942);box-shadow:0 14px 32px rgba(0,0,0,.28);text-align:left;padding:0 18px 18px;color:#fff}
.level:not(:disabled):hover{transform:translateY(-5px)}
.level:focus-visible,.round:focus-visible,.arrow:focus-visible{outline:3px solid #ffe29a;outline-offset:3px}
.level.locked{cursor:not-allowed;background:#3b4149}
.level:not(.locked){border:2px solid #ffe29a;box-shadow:0 0 0 1px rgba(255,226,154,.75),0 0 22px rgba(255,196,61,.6),0 14px 32px rgba(0,0,0,.28)}
.level:not(.locked):hover{box-shadow:0 0 0 2px #ffe29a,0 0 30px rgba(255,196,61,.8),0 14px 32px rgba(0,0,0,.28)}
.level .map-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.25;transition:opacity .2s}
.level.locked .map-art,.level.locked .face,.level.locked .hat{filter:grayscale(1)}
.level.locked::after{background:linear-gradient(180deg,rgba(28,31,35,.22),rgba(20,22,25,.48) 48%,rgba(12,14,17,.96))}
.level:not(:disabled) .map-art{opacity:.43}
.level.america{background-color:#244761}
.level.france{background-color:#4b3446}
.level.australia{background-color:#24483f}
.level.locked.america,.level.locked.france,.level.locked.australia{background-color:#3b4149}
.level::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,22,37,.05),rgba(12,22,37,.35) 48%,rgba(12,22,37,.96))}
.level .face{position:absolute;width:clamp(78px,12vw,128px);height:clamp(78px,12vw,128px);object-fit:cover;left:50%;top:40%;transform:translate(-50%,-50%);z-index:2;border:3px solid rgba(255,255,255,.7);border-radius:50%}
.level .hat{position:absolute;width:clamp(100px,17vw,170px);height:auto;left:50%;top:35%;transform:translate(-50%,-50%);z-index:3}
.level-copy{position:absolute;z-index:4;left:18px;right:18px;bottom:16px;display:grid;gap:6px}
.level-name,.level-state{display:block;line-height:1.3}
.level-name{font-size:1.2rem;font-weight:700}
.level-state{display:flex;align-items:center;min-height:44px;color:#d5e4f2;font-size:.85rem}
.level:not(.locked) .level-state{display:none}
.lock-progress{position:relative;display:grid;place-items:center;width:44px;height:44px;overflow:hidden;border:1px solid rgba(255,255,255,.32);border-radius:50%;background:#c9c9c9}
.lock-progress::before{position:absolute;right:0;bottom:0;left:0;height:var(--unlock-progress,0%);background:#32a879;content:"";transition:height .35s ease}
.lock-glyph{position:relative;z-index:1;width:28px;height:24px}
.lock-shackle{position:absolute;top:0;left:6px;width:16px;height:15px;border:3px solid #111;border-bottom:0;border-radius:10px 10px 0 0;transition:transform .2s,left .2s}
.lock-body{position:absolute;right:0;bottom:0;left:0;height:17px;border:2px solid #111;border-radius:4px;background:#ffc83d;box-shadow:inset 3px 0 #d99600,inset -3px 0 #d99600}
.level:not(.locked) .lock-shackle{left:12px;transform:rotate(28deg);transform-origin:left bottom}
#optionsBtn{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:10;font-size:1.8em}
#menuError{margin:14px 0 0;color:#ffd2c8;text-align:center}

/* win screen */
#winnerMenu{position:fixed;inset:0;margin:auto;width:min(95%,620px);height:min(95%,760px);padding:clamp(18px,4vw,32px);border-radius:25px;overflow:auto;z-index:150;background:linear-gradient(145deg,#254866,#121d32);box-shadow:0 20px 80px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,24px)}
#winnerMenu::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0,rgba(255,209,102,.24),transparent 65%)}
#winnerMenu h2,#winnerMenu .reward-card,#winnerMenu .winner-actions{position:relative}
#winnerMenu h2{width:100%;margin:0}
#winnerMenu .round{position:static;left:auto;top:auto;transform:none}
#winnerMenu .round:active{transform:translateY(3px)}
#winnerMenu .home{top:auto;bottom:auto;left:auto!important;transform:none!important}
.winner-actions{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:auto;padding-top:8px}
.reward-card{width:100%;margin:0 auto;max-width:380px;padding:18px;border:1px solid rgba(255,226,154,.35);border-radius:18px;background:rgba(7,16,31,.55);text-align:center;color:#fff}
.reward-earned{font-size:1.25rem;color:#ffe29a;font-weight:700}
.reward-total{margin-top:8px;font-size:.95rem;color:#d5e4f2}
.coin-shower{height:32px;margin:10px 0;color:#ffd45b;font-size:1.5rem}
.coin-shower span{display:inline-block;animation:coinPop .8s ease-out both}
@keyframes coinPop{0%{transform:translateY(18px) scale(.3) rotate(-30deg);opacity:0}65%{transform:translateY(-8px) scale(1.2) rotate(12deg);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}

/* character creator */
#creator{position:fixed;inset:0;background:#eb9f23;z-index:400;overflow-y:auto;text-align:center;padding-top:35px}
.cam-wrap{position:relative;width:320px;height:240px;margin:0 auto}
#cam-video{width:320px;height:240px;object-fit:cover;transform:scaleX(-1);border:3px solid lime;background:#222;display:block}
#cam-ring{position:absolute;left:50%;top:0;width:240px;height:240px;transform:translateX(-50%);border:10px solid rgba(255,255,255,.5);border-radius:50%;cursor:pointer}
#cam-snap{position:absolute;left:0;top:237px;width:320px;font-size:2em;background:#fff;border:3px solid lime;border-radius:0 0 10px 10px;color:#000}
#cam-upload{position:absolute;right:-48px;top:237px;font-size:2em;cursor:pointer}
#cam-note{margin:70px 16px 0;color:#fff;min-height:1.2em}
.stages{display:flex;gap:10px;justify-content:center;margin:16px 0 40px}
.stage{width:120px;height:180px;border-radius:5px;background:#fff;color:#000;font-size:1.5em;transition:transform .1s,opacity .1s;opacity:.8;transform:scale(.9);box-shadow:0 0 10px rgba(0,0,0,.5)}
.stage.selected{border:7px solid lime;transform:scale(1.1);opacity:1;box-shadow:0 0 30px rgba(0,0,0,.5)}
.stage img{height:100px;border-radius:50%;transform:scaleX(-1)}
.stage hr{margin:4px 0}

@media (max-width:700px){
  #mainMenu{padding-top:max(20px,env(safe-area-inset-top))}
  .title{align-self:flex-start;max-width:calc(100% - 64px);text-align:left;font-size:clamp(1.2rem,6vw,1.7rem)}
  .menu-subtitle{align-self:flex-start;text-align:left}
  .level-grid{grid-template-columns:1fr;max-width:430px}
  .level{min-height:190px}
  .level .map-art{object-fit:cover}
  .level .face{width:76px;height:76px;left:auto;right:24px;top:48%;transform:translateY(-50%)}
  .level .hat{width:92px;left:auto;right:16px;top:25%;transform:none}
  .level-copy{left:14px;right:38%;bottom:13px;gap:4px}
  .level-name{font-size:1.05rem}
  .level-state{line-height:1.25}
  .coin-total{margin-bottom:16px}
  #winnerMenu{height:calc(100% - max(16px,env(safe-area-inset-top)) - max(16px,env(safe-area-inset-bottom)))}
  #winnerMenu{gap:16px}
  .winner-actions{gap:18px}
}
@media (max-height:520px){.panel .round.big{width:76px;height:76px;font-size:2.2em}.teal-panel .options-actions{inset:64px 16px 16px;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:1fr;gap:8px}.teal-panel .options-actions .round{width:clamp(56px,15vh,76px);height:clamp(56px,15vh,76px);font-size:2.2em}.options-actions #optCreator{grid-column:auto}.level-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.level{min-height:210px}}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="drinkCount"></div>
  <button id="pauseBtn" class="round green" title="Pause" hidden>
    <svg class="icon-svg pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
  </button>

  <!-- destination menu and progression -->
  <div id="mainMenu">
    <div class="menu-shell">
      <h1 class="title">Drinkin' Round The World</h1>
      <p class="menu-subtitle">Explore each country, collect every drink, and unlock new destinations.</p>
      <div id="menuCoinTotal" class="coin-total" aria-live="polite"><span class="coin-icon" aria-hidden="true">¢</span><span id="menuCoinValue">0</span><span>coins</span></div>
      <div id="levelGrid" class="level-grid">
      </div>
      <p id="menuError" role="status" hidden></p>
    </div>
    <button id="optionsBtn" class="round teal" title="Options">⚙️</button>
    <div id="options" class="panel teal-panel" hidden>
      <button class="close" data-close="options" title="Close">×</button>
      <div class="options-actions">
        <button id="optSound" class="round big blue sound" title="Toggle sounds"><s>🎵</s></button>
        <button id="optFull" class="round big blue" title="Full screen">⛶</button>
        <button id="optCreator" class="round big orange" title="Create your own characters!">🤳</button>
      </div>
    </div>
  </div>

  <!-- pause -->
  <div id="pauseMenu" class="panel green-panel" hidden>
    <button class="close" id="pauseClose" title="Resume drinking!">×</button>
    <div class="pause-actions">
      <button id="pSound" class="round big sky sound" title="Toggle sounds"><s>🎵</s></button>
      <button id="pRestart" class="round big sky" title="Lost? Restart">↺</button>
      <button id="pFull" class="round big sky" title="Full screen">⛶</button>
      <button id="pHome" class="round big navy" title="Main menu">
        <svg class="icon-svg home-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg>
      </button>
    </div>
  </div>

  <!-- win -->
  <div id="winnerMenu" hidden>
    <h2 id="winnerText"></h2>
    <div class="reward-card" aria-live="polite">
      <div id="coinShower" class="coin-shower" aria-hidden="true"></div>
      <div id="rewardEarned" class="reward-earned"></div>
      <div id="rewardTotal" class="reward-total"></div>
      <div id="rewardStatus" class="reward-total" role="status"></div>
    </div>
    <div class="winner-actions">
      <button id="wRestart" class="round big sky" title="Beat your score! Restart">↺</button>
      <button id="wHome" class="round big navy home" title="Main menu">
        <svg class="icon-svg home-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg>
      </button>
    </div>
  </div>

  <!-- character creator -->
  <div id="creator" hidden>
    <button class="close" id="cam-close" title="Close">×</button>
    <div class="cam-wrap">
      <video id="cam-video" playsinline muted></video>
      <canvas id="cap" width="120" height="120" hidden></canvas>
      <div id="cam-ring"></div>
      <button id="cam-snap" title="Take photo">📷</button>
      <label id="cam-upload" title="Use a photo from this device">📁<input id="cam-file" type="file" accept="image/*" hidden></label>
    </div>
    <p id="cam-note"></p>
    <div class="stages">
      <button id="stage-sober"   class="stage">🍺<hr><img id="img-sober" alt="sober"></button>
      <button id="stage-drunk"   class="stage">🍺🍺<hr><img id="img-drunk" alt="drunk"></button>
      <button id="stage-smashed" class="stage">🍺🍺🍺<hr><img id="img-smashed" alt="smashed"></button>
    </div>
  </div>

  <noscript>This game needs JavaScript.</noscript>
  <!--INLINE_WASM-->
  <script>// Victory phrases shown on the win screen. HTML is allowed (<br/>, <i>, .subtext).
// Edit freely: one array per level, any length. The game picks uniformly at random.
const PHRASES = {
  america: [
  "That took forever. <br/>What are you, a goddamn commie? <br/><span class='subtext'>Drink faster!</span>",
  "About time... <br/>To take stock of the things that are important in your life.<br/><span class='subtext'>Be better at drinking!</span>",
  "That was pathetic. <br/>My grannie drinks her cough medicine faster than that. <br/><span class='subtext'>Do better!</span>",
  "Seriously, what the hell. <br/>Drink like ya mean it you lazy hippie!<br/><span class='subtext'>Blazing speed now!</span>",
  "You made America proud... if America took pride in limp-wristed ninnies!<br/><span class='subtext'>Drink fast. Like a man!</span>",
  "Abraham Lincoln didn't die kickin' Nazi ass so that you could nurse your cosmo-tini or whatever-the-fuck. <br/><span class='subtext'>Drink yourself blind!</span>",
  "I'm sorry, I didn't realize it was 'Embarrass-America-by-being-a-commie-loving-lightweight' Day<br/><span class='subtext'>Drink. Now.</span>",
  "Do you feel that? That's the feeling of you becoming slightly more freedom. Not 'free'... 'freedom'. You're becoming the physical manifestation of freedom. <br/><span class='subtext'>Now act like it!</span>",
  "Remember that Hitler guy? Y'all must've been friends with how slow and terrible that was. <br/><span class='subtext'>Regain your honor.</span>",
  "George Washington would be rolling over in his grave... If he wasn't an immortal, commie-busting demi-God. <br/><span class='subtext'>Be like George.</span>",
  "Think of America as a puppy. Drinking that slowly was like kicking the America puppy in its puppy face. <br/><span class='subtext'>Lap that booze up like a metaphorical America puppy!</span>",
  "Folks like you used be jailed for performances like that. <br/><span class='subtext'>Slow and steady ain't shit! Drink your face off!</span>",
  "In the words of Thomas Jefferson: <br/>'He who permits himself to... blah blah blah or whatever. drinking is good.' <br/><span class='subtext'>Words to live by!</span>",
  "Those who give up binge-drinking for respect deserve neither.' <i>-Ben Franklin</i> <br/><span class='subtext'>Chug chug chug!</span>",
  "In the immortal words of Eleanor Roosevelt: <br/>'Chug! Chug! Chug!' <br/><span class='subtext'>Be a class act like Eleanor.</span>",
  "Nobody said speed-drinking enough alcohol to kill a horse would be easy. <br/><span class='subtext'>Toughen up soldier!</span>",
  "This time it's whiskey. But we'll have you shotgunning paint thinner in no-time. <br/><span class='subtext'>Drink til ya die!</span>",

  <script>// External MP3 playback with a small synthesized music fallback.
const Sound = (() => {
  let ctx = null, master = null, muted = true, rate = 1, who = null;
  let musicAudio = null, musicGain = null, timer = 0, nextT = 0, step = 0;
  const SONGS = {
    america: { root: 261.6, type: 'square', dur: 0.2, pat: [0, 4, 7, 4, 0, 4, 7, 12, 5, 9, 12, 9, 7, 11, 14, 11] },
    france: { root: 220, type: 'triangle', dur: 0.26, pat: [12, null, 16, null, 19, null, 16, null, 14, null, 17, null, 21, null, 17, null] },
    australia: { root: 98, type: 'sawtooth', dur: 0.3, pat: [0, 0, null, 7, 0, null, 5, null] },
  };

        ctx = new AC(); master = ctx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(ctx.destination);

    gain.gain.exponentialRampToValueAtTime(0.0001, time + len);

  }

    const song = SONGS[who]; if (!song || !ctx) return;
    while (nextT < ctx.currentTime + 0.35) {
      const semi = song.pat[step % song.pat.length], len = song.dur / rate;
      if (semi != null) {
        note(song.root * Math.pow(2, semi / 12), nextT, len * 0.95, song.type, 0.5);
        if (who === 'france' && step % 8 === 0) note(song.root / 2, nextT, len * 3, 'sine', 0.8);
        if (who === 'america' && step % 4 === 0) note(song.root / 2, nextT, len * 1.5, 'triangle', 0.8);
        if (who === 'australia' && semi === 0) note(song.root / 2, nextT, len * 2, 'sine', 1);
      }
      nextT += len; step++;

  }
  function playSynth() {
    if (!ctx) return;
    musicGain = ctx.createGain(); musicGain.gain.value = 0.1; musicGain.connect(master);
    nextT = ctx.currentTime + 0.05; step = 0; schedule(); timer = setInterval(schedule, 100);
  }

    clearInterval(timer); timer = 0;
    if (musicAudio) { musicAudio.pause(); musicAudio = null; }
    if (musicGain) { musicGain.disconnect(); musicGain = null; }
    who = null;
  }
  function play(country) {
    ensure(); stop(); who = country; rate = 1;
    const url = Assets.music[country];
    if (!url) { playSynth(); return; }
    musicAudio = new Audio(url); musicAudio.loop = true; musicAudio.volume = muted ? 0 : 0.1;
    musicAudio.playbackRate = rate;
    const result = musicAudio.play();
    if (result && result.catch) result.catch((error) => {
      console.warn('Could not play country music ' + url + '; using synthesized music instead.', error);
      if (who === country) { musicAudio = null; playSynth(); }
    });
  }
  function setRate(value) {
    rate = Math.max(0.25, value);
    if (musicAudio) musicAudio.playbackRate = rate;
  }
  function pop(country) {
    if (muted) return;
    const url = Assets.sfx[country];
    if (url) {
      const audio = new Audio(url); audio.volume = 0.3;
      const result = audio.play();
      if (result && result.catch) result.catch((error) => console.warn('Could not play collection sound ' + url + '.', error));
      return;
    }
    if (!ctx || !master) return;
    const time = ctx.currentTime, gain = ctx.createGain(), oscillator = ctx.createOscillator();
    gain.gain.value = 0.3; gain.connect(master); oscillator.connect(gain);
    if (country === 'america') { oscillator.type = 'square'; oscillator.frequency.setValueAtTime(180, time); oscillator.frequency.exponentialRampToValueAtTime(60, time + 0.12); }
    else if (country === 'france') { oscillator.type = 'sine'; oscillator.frequency.setValueAtTime(400, time); oscillator.frequency.exponentialRampToValueAtTime(900, time + 0.1); }
    else { oscillator.type = 'triangle'; oscillator.frequency.setValueAtTime(700, time); oscillator.frequency.exponentialRampToValueAtTime(120, time + 0.14); }
    gain.gain.setValueAtTime(0.3, time); gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);

    if (musicAudio) musicAudio.volume = muted ? 0 : 0.1;
    return muted;
  }
  return { play, stop, setRate, pop, toggle, unlock: ensure, get muted() { return muted; } };
})();

  <script>// Character creator: snap (or upload) three face photos: sober, drunk, smashed.
// Photos are cropped to a 120x120 circle and never leave the device.
const Camera = (() => {
  const $ = (id) => document.getElementById(id);
  const photos = [null, null, null];          // canvases (120x120) per drunkenness stage
  const STAGES = ['sober', 'drunk', 'smashed'];
  let stream = null, raf = 0, selected = 0, onChange = () => {};
  let cap, capCtx, video, source = null;

  function mask() { return photos.reduce((m, p, i) => m | (p ? 1 << i : 0), 0); }

  function select(i) {
    selected = i;
    STAGES.forEach((s, k) => $('stage-' + s).classList.toggle('selected', k === i));
  }

  function draw() {
    raf = requestAnimationFrame(draw);
    const src = source || (video.readyState >= 2 ? video : null);
    capCtx.clearRect(0, 0, 120, 120);
    if (src) {
      // Same framing as the original: a 160x120 draw offset by -20 so the 4:3 frame is centre-cropped.
      const sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
      const s = Math.min(sw / 4, sh / 3); // largest 4:3 region
      capCtx.drawImage(src, (sw - 4 * s) / 2, (sh - 3 * s) / 2, 4 * s, 3 * s, -20, 0, 160, 120);
    }
  }

  function snap() {
    const out = document.createElement('canvas'); out.width = out.height = 120;
    const x = out.getContext('2d'); x.drawImage(cap, 0, 0);
    photos[selected] = out;
    $('img-' + STAGES[selected]).src = out.toDataURL('image/png');
    onChange(selected, out, mask());
  }

  async function open() {
    $('creator').hidden = false;
    select(selected);
    source = null;
    $('cam-note').textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false });
      video.srcObject = stream; await video.play();
    } catch {
      $('cam-note').textContent = 'No camera available. Use 📁 to pick a photo instead.';
    }
    cancelAnimationFrame(raf); draw();
  }

  function close() {
    cancelAnimationFrame(raf);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    $('creator').hidden = true;
  }

  function init(cb) {
    onChange = cb;
    cap = $('cap'); capCtx = cap.getContext('2d'); video = $('cam-video');
    $('cam-snap').addEventListener('click', snap);
    $('cam-ring').addEventListener('click', snap);
    $('cam-close').addEventListener('click', close);
    STAGES.forEach((s, i) => {
      $('stage-' + s).addEventListener('click', () => select(i));
      $('img-' + s).src = Assets.characterUrl(s);
    });
    $('cam-file').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { source = im; URL.revokeObjectURL(im.src); };
      im.src = URL.createObjectURL(f);
      e.target.value = '';
    });
  }
  return { init, open, close, mask, photos };
})();

  <script>// Boot, game loop, rendering and menu wiring.
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const COIN_KEY = 'drinkinUnlockCoins';
  const DRINKS = 50; // drinks per level (core supports up to 256)
  const canvas = $('game'), ctx = canvas.getContext('2d');

  let state = 'menu', level = 0, raf = 0, last = 0, shownCount = -1, elapsedMs = 0, coins = 0;
  let rewardFrame = 0;

  async function loadBarLocations(country) {
    if (location.protocol === 'file:') return [];
    const response = await fetch('media/countries/' + country.id + '/bars.geojson');
    if (response.status === 404) return [];
    if (!response.ok) throw new Error('HTTP ' + response.status);

    if (!collection || collection.type !== 'FeatureCollection' || !Array.isArray(collection.features)) {
      throw new Error('Expected a GeoJSON FeatureCollection.');
    }
    return collection.features.slice(0, DRINKS).map((feature, index) => {
      const geometry = feature && feature.geometry, coordinates = geometry && geometry.coordinates;
      if (!geometry || geometry.type !== 'Point' || !Array.isArray(coordinates) ||
          coordinates.length < 2 || !Number.isFinite(coordinates[0]) || !Number.isFinite(coordinates[1])) {
        throw new Error('Feature ' + (index + 1) + ' must have Point coordinates [longitude, latitude].');
      }

    $('rewardTotal').textContent = 'Total: ' + previous + ' coins';
    const shower = $('coinShower');
    shower.replaceChildren();

  // ---- wiring ------------------------------------------------------------------------

    document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => show(b.dataset.close, false); });

    $('wRestart').onclick = () => startLevel(level);
    $('pHome').onclick = $('wHome').onclick = home;

    updateSoundIcons();
  }

  (async function main() {
    $('drinkCount').hidden = true;
    resize();
    await Promise.all([boot(), Assets.loadAll()]);
    resize();
    createLevelCards();
    await Promise.all(COUNTRIES.map(async (country) => {
      try {

      } catch (error) {

        barLocations[country.id] = [];

})();
